name: "901 E508 official MoMA version-conflict event ledger"
on:
  push:
    branches: [cloud-901-e508-version-conflict-source-register-20261116]
    paths:
      - ".github/workflows/901-e508-moma-event-conflicts.yml"
      - "research_901/E508_20261116/e508_event_conflicts.py"
permissions:
  contents: read
jobs:
  source-events:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        archive:
          - 20221220_E08_GFP.zip
          - 20221220_E08_GFP_pl.zip
          - 20221220_rplN_GFP_pl.zip
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research_901/E507_20261116
            research_901/E508_20261116
      - run: python -m pip install -q requests
      - name: Re-fetch authenticated original source CSVs and enumerate all unmatched divisions
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          python research_901/E508_20261116/e508_event_conflicts.py --archive "$ARCHIVE" --recompute-official-csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 901-E508-source-events-${{ matrix.archive }}
          path: |
            e507_alternate_QA/
            e508_source_conflicts/
          retention-days: 30
          if-no-files-found: warn
