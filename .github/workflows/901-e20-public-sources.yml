name: Fetch E20 published QS and respiratory primary sources
on:
  push:
    branches: ['cloud-public-sources-901-e20-20261022']
    paths: ['.github/workflows/901-e20-public-sources.yml']
permissions: {}
jobs:
  fetch:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Retrieve verifiable publisher article bytes, no analysis
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, pathlib, urllib.request, time
          out=pathlib.Path('e20_pinned_source_archive');out.mkdir()
          studies={
            'Toyofuku2007':'PMC1913425',
            'Toyofuku2008':'PMC2593205',
            'Bose2008':'PMC4264523',
            'Visick2000':'PMC94630',
            'Hoffman2010':'PMC2822885'
          }
          candidates=[]
          for study,pmc in studies.items():
            candidates += [
              (study,'europepmc_xml',f'https://www.ebi.ac.uk/europepmc/webservices/rest/{pmc}/fullTextXML','.xml'),
              (study,'europepmc_pdf',f'https://europepmc.org/articles/{pmc}?pdf=render','.pdf'),
              (study,'ncbi_pdf',f'https://pmc.ncbi.nlm.nih.gov/articles/{pmc}/pdf/','.pdf')
            ]
          candidates += [
            ('Toyofuku2007','asm_pdf','https://journals.asm.org/doi/pdf/10.1128/jb.00289-07','.pdf'),
            ('Toyofuku2008','asm_pdf','https://journals.asm.org/doi/pdf/10.1128/jb.00968-08','.pdf'),
            ('Bose2008','springer_pdf','https://link.springer.com/content/pdf/10.1007/s00203-008-0387-1.pdf','.pdf'),
            ('Hoffman2010','plos_pdf','https://journals.plos.org/plospathogens/article/file?id=10.1371/journal.ppat.1000712&type=manuscript','.pdf'),
            ('Visick2000','asm_pdf','https://journals.asm.org/doi/pdf/10.1128/jb.182.16.4578-4586.2000','.pdf')
          ]
          def work(row):
            study,route,url,ext=row
            entry={'study':study,'route':route,'url':url,'ext':ext,'status':'FAIL'}
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'AcademicSourceVerification/1.0','Accept':'application/pdf,application/xml,text/xml,text/plain'})
              with urllib.request.urlopen(request,timeout=22) as resp:
                b=resp.read(12_000_001)
                entry['http_code']=resp.status;entry['final_url']=resp.url;entry['content_type']=resp.headers.get('Content-Type')
              if len(b)>12_000_000:raise ValueError('Source >12MB limit')
              if ext=='.pdf':
                if not b.startswith(b'%PDF-'):raise ValueError('not PDF magic')
              else:
                if b'<article' not in b[:3000] or b'<article-id' not in b:raise ValueError('not NLM article XML')
              entry['status']='PASS';entry['bytes']=len(b);entry['sha256']=hashlib.sha256(b).hexdigest();entry['source']=b
            except Exception as e:entry['error']=str(e)[:220]
            return entry
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as executor:
            results=list(executor.map(work,candidates))
          saved={}
          for x in results:
            b=x.pop('source',None)
            if b is None:continue
            name=x['study']+'_'+x['route']+x['ext']
            (out/name).write_bytes(b)
            saved[name]={'bytes':len(b),'sha256':x['sha256']}
          manifest={'run_id':os.getenv('GITHUB_RUN_ID'),'source_only':True,'analysis_performed':False,'files':saved,'attempts':results}
          (out/'PUBLIC_SOURCE_FETCH_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps({'good_files':saved,'failures':[(x['study'],x['route'],x.get('error')) for x in results if x['status']=='FAIL']}))
          PY
      - name: Keep source files only one day
        uses: actions/upload-artifact@v4
        with:
          name: e20-verifiable-public-source-documents
          path: e20_pinned_source_archive/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
