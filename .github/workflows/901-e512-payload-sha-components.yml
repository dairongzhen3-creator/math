name: "901 E512 source-authenticated full MoMA maps and component forests"
on:
  push:
    branches: [cloud-901-e512-original-probability-component-audit-20261116]
    paths:
      - ".github/workflows/901-e512-payload-sha-components.yml"
      - "research_901/E512_20261116/e512_original_payload_sha_comparison.py"
permissions:
  contents: read
jobs:
  source-payload-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        archive:
          - 20221220_E08_GFP_pl.zip
          - 20221220_rplN_GFP_pl.zip
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research_901/E512_20261116
      - name: Install source and TIFF decoders
        run: python -m pip install -q requests numpy tifffile
      - name: Verify full ZIP64 source member CRC/SHA for both MoMA versions and analyze pre-frozen pixel slices
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          python research_901/E512_20261116/e512_original_payload_sha_comparison.py --archive "$ARCHIVE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 901-E512-full-verified-original-${{ matrix.archive }}
          path: e512_verified_original_sources/
          retention-days: 30
          if-no-files-found: warn
