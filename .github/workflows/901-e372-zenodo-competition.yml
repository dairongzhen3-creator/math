name: 901 E372 bounded Zenodo external competition data intake
on:
  push:
    branches: ['cloud-public-sources-901-e372-20261107']
    paths: ['.github/workflows/901-e372-zenodo-competition.yml']
permissions: {}
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    steps:
      - name: Acquire one original public archive and verify provenance and member CRCs
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,hashlib,io,zipfile,json,pathlib,os
          root=pathlib.Path("901_e372_zenodo_public");root.mkdir(exist_ok=True)
          url="https://zenodo.org/records/8118683/files/data.zip?download=1"
          expected="46ba6051e06ceda6dd7984973ccde3f3"
          rec={"project":901,"stage":"E372","repository":"https://zenodo.org/records/8118683","file":"data.zip","source_url":url,"expected_md5":expected,"run_id":os.environ.get("GITHUB_RUN_ID"),"status":"NOT_RECEIVED"}
          try:
              req=urllib.request.Request(url,headers={"User-Agent":"AcademicReproducibilityResearch/1.0","Accept":"application/zip,application/octet-stream"})
              with urllib.request.urlopen(req,timeout=75) as response:
                  rec["http_status"]=response.status
                  rec["content_type"]=response.headers.get("Content-Type","")[:100]
                  raw=response.read(36_000_001)
              rec["actual_bytes"]=len(raw)
              rec["actual_md5"]=hashlib.md5(raw).hexdigest()
              rec["sha256"]=hashlib.sha256(raw).hexdigest()
              if len(raw)>36_000_000:raise ValueError("BOUND_36MB_EXCEEDED")
              if not raw.startswith(bytes([80,75,3,4])):raise ValueError("NOT_ZIP")
              if rec["actual_md5"]!=expected:raise ValueError("OFFICIAL_MD5_MISMATCH")
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  infos=z.infolist()
                  if len(infos)>5000 or sum(i.file_size for i in infos)>500_000_000:raise ValueError("ZIP_BOMB_GUARD")
                  if any(i.filename.startswith("/") or ".." in i.filename.replace("\\","/").split("/") for i in infos):raise ValueError("PATH_TRAVERSAL")
                  if z.testzip() is not None:raise ValueError("ZIP_CRC_FAILURE")
                  rec["zip_members"]=len(infos)
                  rec["member_table"]=[{"name":i.filename,"bytes":i.file_size} for i in infos if i.filename.lower().endswith(('.csv','.tsv','.md','.txt'))][:500]
              (root/"E372_original_zenodo_data.zip").write_bytes(raw)
              rec["status"]="PASS_OFFICIAL_MD5_ZIP_CRC"
          except Exception as e:
              rec.update(status="BLOCKED_OR_REJECTED",error_type=type(e).__name__,error=str(e)[:300])
          (root/"E372_intake_receipt.json").write_text(json.dumps(rec,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps({k:v for k,v in rec.items() if k!="member_table"},ensure_ascii=False))
          print("relevant_member_names",json.dumps(rec.get("member_table",[])[:80],ensure_ascii=False))
          PY
      - name: Temporarily archive official public source and receipt
        uses: actions/upload-artifact@v4
        with:
          name: 901-e372-zenodo-independent-competition
          path: 901_e372_zenodo_public/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
