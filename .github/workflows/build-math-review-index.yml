name: Build independent math reading index

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-math-review-index.yml'

permissions:
  contents: write

concurrency:
  group: independent-math-reading-index
  cancel-in-progress: false

jobs:
  catalogue:
    if: github.repository == 'dairongzhen3-creator/math'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the reviewed indexer and build metadata only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INDEXER_COMMIT: ced60b7e983be8feb2ea5644ce05df1e9d6cd7a0
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          repository = os.environ['GITHUB_REPOSITORY']
          if repository != 'dairongzhen3-creator/math':
              raise SystemExit('Unexpected repository')
          url = 'https://api.github.com/repos/' + repository + '/contents/our_review/build_review_index.py?ref=' + os.environ['INDEXER_COMMIT']
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'independent-math-reading-ledger',
              'X-GitHub-Api-Version': '2022-11-28'
          })
          with urllib.request.urlopen(request, timeout=45) as response:
              result = json.load(response)
          source = base64.b64decode(result['content'])
          blob = hashlib.sha1(b'blob ' + str(len(source)).encode() + b'\0' + source).hexdigest()
          if len(source) != result['size'] or blob != result['sha']:
              raise SystemExit('Indexer integrity check failed')
          pathlib.Path('build_review_index.py').write_bytes(source)
          PY
          python3 build_review_index.py --self-test
          python3 build_review_index.py --remote --publish
