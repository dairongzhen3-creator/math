name: 901 E117 verify original multielectrode Mimosa source
on:
  push:
    paths:
      - '.github/workflows/901-e117-mimosa-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    if: github.repository == 'dairongzhen3-creator/math'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research_901/E117_mimosa_raw_source_audit.py
          persist-credentials: false
      - name: Audit author published raw signals against author's compiled workbook
        shell: bash
        run: python3 research_901/E117_mimosa_raw_source_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 901-E117-mimosa-raw-source-reconciliation
          path: |
            901_E117_fig4_source_audit.json
            901_E117_fig4_speed_by_edge.csv
          retention-days: 7
          if-no-files-found: warn
