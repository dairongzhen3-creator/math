name: "901 E505 real source MoMA CellTracks and CellStats pilot, not images"
on:
  push:
    branches: [cloud-901-e505-moma-tracks-20261116]
    paths:
      - ".github/workflows/901-e505-moma-csv-pilot.yml"
permissions:
  contents: read
jobs:
  pilot-original-track:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install HTTP-only minimal runtime
        run: python -m pip install -q requests
      - name: Original eight-archive metadata already frozen; retrieve only four GLs' two CSVs
        run: python research_901/E505_20261116/pilot_original_moma_csv.py
      - name: Save original source CSVs and per-member SHA/CRC receipts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 901-E505-MoMA-four-GL-authentic-tracks-and-stats
          path: e505_pilot_originals/
          retention-days: 21
          if-no-files-found: error
