name: 900 P326C verify public PNAS supplementary S3 sources
on:
  push:
    paths:
      - '.github/workflows/900-p326-s3-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-source:
    if: github.repository == 'dairongzhen3-creator/math'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research_900/P326_s3_multi_source.py
          persist-credentials: false
      - name: Check only official public PNAS and NCBI/Europe PMC endpoints
        run: python3 research_900/P326_s3_multi_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 900-P326C-PNAS-S3-provenance
          path: P326_PNAS_S3_SOURCE/
          retention-days: 7
          if-no-files-found: error
