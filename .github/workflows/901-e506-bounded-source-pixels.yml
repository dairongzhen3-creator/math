name: "901 E506 bounded original microscopy frame source preflight"
on:
  push:
    branches: [cloud-901-e506-original-pixel-audit-20261116]
    paths:
      - ".github/workflows/901-e506-bounded-source-pixels.yml"
      - "research_901/E506_20261116/preflight_image_members.py"
permissions:
  contents: read
jobs:
  source-three-gls:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        archive:
          - 20221220_E08_GFP_pl.zip
          - 20221220_NO_LIGHT_E08_GFP_pl.zip
          - 20221220_NO_LIGHT_E08_GFP.zip
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research_901/E506_20261116
      - run: python -m pip install -q requests
      - name: Retrieve only source-authentic MoMA diagnostic PNGs, CellStats and TIFF directory metadata
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: python research_901/E506_20261116/preflight_image_members.py --archive "$ARCHIVE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 901-E506-bounded-image-source-${{ matrix.archive }}
          path: e506_bounded/
          retention-days: 21
          if-no-files-found: warn
