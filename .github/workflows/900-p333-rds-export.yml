name: 900 P333C source-locked RDS CSV export
on:
  push:
    paths:
      - '.github/workflows/900-p333-rds-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-convert:
    if: github.repository == 'dairongzhen3-creator/math'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research_900/P333_bounded_joller_source.py
            research_900/P333_pyreadr_export.py
          persist-credentials: false
      - name: Retrieve public 10-file pinned source
        run: python3 research_900/P333_bounded_joller_source.py
      - name: Install binary-only RDS reader
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: pyreadr pandas
      - name: Convert verified public RDS tables
        run: python3 research_900/P333_pyreadr_export.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 900-P333C-verified-RDS-tables
          path: P333_JOLLER_PINNED_SOURCES/
          retention-days: 7
          if-no-files-found: error
