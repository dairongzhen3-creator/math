name: "901 E491 ODEinherit published 6-protein lineage original"
on:
  push:
    branches: [cloud-901-e491-calibration-and-yeast-20261115]
    paths: [".github/workflows/901-e491-odeinherit-source.yml"]
permissions:
  contents: read
jobs:
  verified-original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify published exact .rda bytes and immutable git blob
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,hashlib,os,pathlib,json,datetime
          url='https://raw.githubusercontent.com/WenbinWu2001/ODEinherit/master/data/cell_lineage_data.rda'
          ref_sha1='7476698785cf75fde518ec0fd29dc59be38ae799'
          ref_size=747617
          root=pathlib.Path('e491_odeinherit_source');root.mkdir(exist_ok=True)
          req=urllib.request.Request(url,headers={'User-Agent':'901-E491-original-lineage-science/1.0'})
          with urllib.request.urlopen(req,timeout=40) as f: raw=f.read(1000000)
          git_sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\x00'+raw).hexdigest()
          assert len(raw)==ref_size and git_sha==ref_sha1,(len(raw),git_sha)
          (root/'cell_lineage_data.rda').write_bytes(raw)
          (root/'original_source_receipt.json').write_text(json.dumps({
             'source':url,'download_size':len(raw),'github_blob_sha1':git_sha,
             'source_SHA256':hashlib.sha256(raw).hexdigest(),
             'published_study_doi':'10.1080/01621459.2025.2525238',
             'source_type':'RData processed mother-daughter protein trajectories, NOT molecule counts',
             'result':'ORIGINAL_BYTES_AND_GIT_BLOB_VERIFIED',
             'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          },indent=2))
          print('SOURCE_PASS',len(raw),git_sha,hashlib.sha256(raw).hexdigest())
          PY
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Export source metadata and six time series without changing raw bytes
        shell: bash
        run: |
          Rscript - <<'RS'
          root <- 'e491_odeinherit_source'
          nms <- load(file.path(root,'cell_lineage_data.rda'),envir=.GlobalEnv)
          stopifnot('cell_lineage_data' %in% nms)
          d <- cell_lineage_data
          stopifnot(is.list(d),all(c('time_series','metadata') %in% names(d)))
          stopifnot(is.data.frame(d$metadata),is.list(d$time_series))
          vars <- names(d$time_series)
          stopifnot(length(vars)==6)
          md <- d$metadata
          stopifnot(all(c('cell_id','cell_birth_timepoint') %in% names(md)))
          n <- nrow(md)
          write.csv(md,file.path(root,'metadata_original.csv'),row.names=FALSE,na='')
          long <- lapply(seq_along(vars), function(k) {
            m <- d$time_series[[k]]
            stopifnot(is.matrix(m),nrow(m)==n,is.numeric(m))
            data.frame(cell_index=rep(seq_len(n),each=ncol(m)),
                       cell_id=rep(as.character(md$cell_id),each=ncol(m)),
                       protein=vars[[k]],
                       time_index=rep(seq_len(ncol(m)),times=n),
                       source_value=as.vector(t(m)),stringsAsFactors=FALSE)
          })
          ll <- do.call(rbind,long)
          write.csv(ll,file.path(root,'time_series_original_long.csv'),row.names=FALSE,na='')
          writeLines(c(
             paste('data_object',paste(nms,collapse=',')),
             paste('n_cells',n),
             paste('proteins',paste(vars,collapse=',')),
             paste('metadata_columns',paste(names(md),collapse=',')),
             paste('all_original_time_points',ncol(d$time_series[[1]])),
             paste('long_rows',nrow(ll)),
             paste('finite_rows',sum(is.finite(ll$source_value))),
             paste('missing_rows',sum(is.na(ll$source_value))),
             'data_use=Source numeric reporter trajectories only; no photon calibration or instrument technical repeat proven'
          ),file.path(root,'source_structure.txt'))
          print(paste(readLines(file.path(root,'source_structure.txt')),collapse='\n'))
          RS
      - name: Permanent handoff artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 901-E491-ODEinherit-official-RData-and-audit
          path: e491_odeinherit_source/
          retention-days: 21
          if-no-files-found: error
