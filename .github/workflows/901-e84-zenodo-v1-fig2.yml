name: 901 E84 bounded Zenodo v1 Figure 2 CSV provenance intake
on:
  push:
    branches: ['cloud-public-sources-901-e83-20261026']
    paths: ['.github/workflows/901-e84-zenodo-v1-fig2.yml']
permissions: {}
jobs:
  intake:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - name: Download published v1 Figure2 CSV only
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,urllib.request,csv,io,json,os
          d=pathlib.Path('e84_zenodo_v1');d.mkdir()
          url='https://zenodo.org/records/16737206/files/Multi-Species_Growth_Curve___C8HSL%20figure%202.csv?download=1'
          expected_md5='f81dd1d8473d318383a2551c6f8d99e1'
          r={'stage':'E84','project':901,'record_url':'https://zenodo.org/records/16737206','version':'v1','filename':'Multi-Species_Growth_Curve___C8HSL figure 2.csv','expected_md5':expected_md5,'status':'BLOCKED','run_id':os.getenv('GITHUB_RUN_ID')}
          try:
            req=urllib.request.Request(url,headers={'User-Agent':'AcademicOpenDataProvenance/1.0'})
            with urllib.request.urlopen(req,timeout=50) as resp:
              raw=resp.read(100_001)
              r['http_status']=resp.status
            r['received_bytes']=len(raw);r['md5']=hashlib.md5(raw).hexdigest()
            if len(raw)>100000:raise ValueError('MAX_100KB')
            if r['md5']!=expected_md5:raise ValueError('OFFICIAL_MD5_MISMATCH')
            s=raw.decode('utf-8-sig')
            rows=list(csv.DictReader(io.StringIO(s)))
            if len(rows)!=630:raise ValueError('CSV_ROWS_MISMATCH_'+str(len(rows)))
            if not {'Strain','Condition','Time (hrs)','Replicate','OD570'}.issubset(rows[0]):raise ValueError('CSV_HEADER_MISMATCH')
            r.update(status='PASS_V1_OFFICIAL_MD5',rows=len(rows),sha256=hashlib.sha256(raw).hexdigest(),unique_strains=sorted(set(x['Strain'] for x in rows)),unique_conditions=sorted(set(x['Condition'] for x in rows)))
            (d/'901_E84_Zenodo_v1_Figure2_original.csv').write_bytes(raw)
          except Exception as e:
            r['error_type']=type(e).__name__;r['error']=str(e)[:180]
          (d/'E84_v1_intake_receipt.json').write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n',encoding='utf8')
          print(json.dumps(r,ensure_ascii=False))
          PY
      - name: Keep bounded official public attachment receipt for one day
        uses: actions/upload-artifact@v4
        with:
          name: 901-e84-zenodo-v1-fig2-source
          path: e84_zenodo_v1/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
