name: "901 E505 source-certified MoMA parent lineage for 118 unmatched GLs"
on:
  push:
    branches: [cloud-901-e505-moma-tracks-20261116]
    paths:
      - ".github/workflows/901-e505-moma-118-lineage.yml"
      - "research_901/E505_20261116/analyze_e505_all_mismatched_GL.py"
permissions:
  contents: read
  actions: read
jobs:
  source-per-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        archive:
          - 20221220_E08_GFP.zip
          - 20221220_E08_GFP_pl.zip
          - 20221220_rplN_GFP.zip
          - 20221220_rplN_GFP_pl.zip
          - 20221220_NO_LIGHT_E08_GFP.zip
          - 20221220_NO_LIGHT_E08_GFP_pl.zip
          - 20221220_NO_LIGHT_rplN_GFP.zip
          - 20221220_NO_LIGHT_rplN_GFP_pl.zip
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research_901/E505_20261116
      - uses: actions/download-artifact@v4
        with:
          name: 901-E504-source-verified-pre-exposure-riskset
          run-id: 43796834987
          github-token: ${{ github.token }}
          path: e504_frozen
      - name: Install HTTP range client
        run: python -m pip install -q requests
      - name: Verified original MoMA CellStats parent_ID chains in this source archive
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: python research_901/E505_20261116/analyze_e505_all_mismatched_GL.py --archive "$ARCHIVE"
      - name: Retain per-archive raw member hashes, exact links, and negative evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 901-E505-authentic-parent-${{ matrix.archive }}
          path: e505_full_verified/
          retention-days: 21
          if-no-files-found: warn
