name: 901 E90 Edinburgh published dated bioreactor data intake
on:
  push:
    branches: ['cloud-public-sources-901-e90-20261026']
    paths: ['.github/workflows/901-e90-edinburgh-biological-replicates.yml']
permissions: {}
jobs:
  intake:
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    steps:
      - name: Bounded intake of two published official Zenodo files and CRC integrity check
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request, hashlib, zipfile, io, json, os, stat
          out=pathlib.Path('e90_official_edinburgh_sources');out.mkdir()
          spec=[
            ('README.txt','6eb3664b7d3048d89c4cede62cd9ee05', 40000),
            ('Fig-S2-Bulk_doubling_rates-Bioreactor.zip','cd95859400100769ec5a418d447f752d', 5_000_000),
          ]
          report={'project':901,'stage':'E90','dataset_doi':'10.5281/zenodo.15311905','record_url':'https://zenodo.org/records/15311905','run_id':os.getenv('GITHUB_RUN_ID'),'data_scope':'one bioreactor archive plus its official README only','items':[]}
          for name,md5_expected,limit in spec:
            r={'file':name,'source_url':'https://zenodo.org/records/15311905/files/'+name+'?download=1','expected_published_md5':md5_expected,'status':'NOT_RECEIVED'}
            try:
              req=urllib.request.Request(r['source_url'],headers={'User-Agent':'AcademicPublicDataProvenance/1.0'})
              with urllib.request.urlopen(req,timeout=90) as response:
                b=response.read(limit+1)
                r['http_status']=response.status;r['content_type']=(response.headers.get('Content-Type') or '')[:100]
              r.update(received_bytes=len(b),actual_md5=hashlib.md5(b).hexdigest(),prefix_hex=b[:12].hex())
              if len(b)>limit:raise ValueError('BOUNDED_SIZE_EXCEEDED')
              if r['actual_md5']!=md5_expected:raise ValueError('PUBLISHED_MD5_MISMATCH')
              if name.endswith('.zip'):
                if not b.startswith(bytes([80,75,3,4])):raise ValueError('BAD_ZIP_SIGNATURE')
                with zipfile.ZipFile(io.BytesIO(b)) as z:
                  members=z.infolist()
                  if len(members)>650 or sum(m.file_size for m in members)>100_000_000:raise ValueError('ZIP_BOMB_BOUNDS')
                  if any('..' in m.filename.split('/') or m.filename.startswith('/') for m in members):raise ValueError('UNSAFE_PATH')
                  if any(stat.S_IFMT((m.external_attr >> 16)&0xffff)==stat.S_IFLNK for m in members):raise ValueError('SYMLINK_DISALLOWED')
                  if z.testzip() is not None:raise ValueError('ZIP_CRC_FAILURE')
                  r['zip_members']=len(members)
                  r['txt_file_count']=sum(x.filename.lower().endswith('.txt') for x in members)
              else:
                s=b.decode('utf-8-sig')
                if 'OGI-BIO' not in s or 'Each replicate folder' not in s or 'Three independent replicates' not in s and 'Three independent' not in s:
                  # Source wording may have lower-case 'Three'; avoid unnecessary false negatives if official hash already passed.
                  if 'OGI-BIO' not in s or 'Each replicate folder' not in s:
                    raise ValueError('EXPECTED_README_FIELDS_MISSING')
              (out/name).write_bytes(b)
              r.update(status='PASS_PUBLISHED_MD5_CRC',sha256=hashlib.sha256(b).hexdigest())
            except Exception as exc:
              r.update(status='REJECTED_OR_BLOCKED',error_type=type(exc).__name__,error=str(exc)[:230])
            report['items'].append(r)
          report['all_two_verified']=all(r['status']=='PASS_PUBLISHED_MD5_CRC' for r in report['items'])
          (out/'E90_public_intake_receipt.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Keep only bounded public source files and receipts for one day
        uses: actions/upload-artifact@v4
        with:
          name: 901-e90-edinburgh-verified-bioreactor
          path: e90_official_edinburgh_sources/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
