name: "901 E512 original MoMA probability component sources inventory"
on:
  push:
    branches: [cloud-901-e512-original-probability-component-audit-20261116]
    paths:
      - ".github/workflows/901-e512-original-component-inventory.yml"
      - "research_901/E512_20261116/e512_source_inventory.py"
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        archive:
          - 20221220_E08_GFP_pl.zip
          - 20221220_rplN_GFP_pl.zip
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research_901/E512_20261116
      - run: python -m pip install -q requests
      - name: Verify original official ZIP64 central source and enumerate probability maps and component forests
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: python research_901/E512_20261116/e512_source_inventory.py --archive "$ARCHIVE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 901-E512-auth-original-inventory-${{ matrix.archive }}
          path: e512_verified_inventory/
          retention-days: 30
          if-no-files-found: warn
