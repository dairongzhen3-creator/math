name: "901 E500 published 2026 illumination versus no-light true control"
on:
  push:
    branches: [cloud-901-e500-illumination-controls-20261115]
    paths: [".github/workflows/901-e500-original-light-controls.yml"]
permissions:
  contents: read
jobs:
  controlled-original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Arrow reader for publisher Feather data
        run: python -m pip install -q pyarrow pandas numpy
      - name: Source-verified HTTP 206 ZIP member; original bytes CRC, original cell fate and exposure schedule
        shell: bash
        run: |
          python - <<'PY'
          import requests,struct,zlib,hashlib,pathlib,json,time,collections,io
          import pandas as pd,pyarrow.feather as f
          P=pathlib.Path('e500_author_original_control');P.mkdir(exist_ok=True)
          zurl='https://zenodo.org/api/records/18059846/files/Gervais2026_data.zip/content'
          size=842127932;s=requests.Session();s.headers['User-Agent']='901-E500-original-light-control-scientific-QA'
          def get(a,b):
            assert 0<=a<=b<size and b-a+1 <= 52_000_000
            r=s.get(zurl,headers={'Range':f'bytes={a}-{b}'},stream=True,timeout=(25,110))
            assert r.status_code==206 and r.headers.get('Content-Range')==f'bytes {a}-{b}/{size}',(r.status_code,r.headers)
            chunks=bytearray()
            for part in r.iter_content(262144):
              if part:chunks.extend(part)
              assert len(chunks)<=52_000_000
            assert len(chunks)==b-a+1
            return bytes(chunks)
          tail_len=2*1024*1024
          z=get(size-tail_len,size-1)
          end=z.rfind(b'PK\x05\x06');assert end>=0
          e=struct.unpack_from('<4s4H2IH',z,end);n=e[4];offset=e[6];assert n==21 and offset>=size-tail_len
          i=offset-(size-tail_len);entries={}
          for _ in range(n):
            h=struct.unpack_from('<4s6H3I5H2I',z,i);assert h[0]==b'PK\x01\x02'
            nl,el,cl=h[10:13];name=z[i+46:i+46+nl].decode('utf8')
            entries[name]={'crc':h[7],'method':h[4],'compressed':h[8],'raw':h[9],'start':h[16]}
            i+=46+nl+el+cl
          key='Gervais2026_data/Exported_data/myframes_control.feather'
          m=entries[key];assert m['raw']==302295912 and m['compressed']==49237875 and m['method']==8
          header=get(m['start'],m['start']+511)
          lh=struct.unpack_from('<4s5H3I2H',header);assert lh[0]==b'PK\x03\x04'
          assert header[30:30+lh[-2]].decode('utf8')==key
          body_start=m['start']+30+lh[-2]+lh[-1]
          raw=zlib.decompress(get(body_start,body_start+m['compressed']-1),-15)
          assert len(raw)==m['raw'] and zlib.crc32(raw)==m['crc']
          file=P/'myframes_control.feather';file.write_bytes(raw)
          df=f.read_table(file).to_pandas()
          print('E500_SOURCE_SCHEMA',len(df),list(df.columns),flush=True)
          names=['condition','strain','date','c_step','gl_id','cell','b_rank','end_type','time_start','time_end','m_start','m_end','time_sec','acq_freq_sec','Fluo1','prom','length_um','fluo_ampl_ch1','plasmid']
          desc={'source_rows':len(df),'source_columns':list(df.columns),'source_types':{k:str(v) for k,v in df.dtypes.to_dict().items()},
                'available_keys':{k:k in df.columns for k in names}}
          for col in ['condition','date','strain','c_step','end_type','Fluo1','prom','plasmid']:
            if col in df:
              counts=df[col].value_counts(dropna=False)
              desc[col+'_counts']={str(k):int(v) for k,v in counts.items()}
          # group by condition/date/growth state to evaluate whether the source includes actual within-phase dual illumination schedules
          fields=[x for x in ['date','condition','c_step','Fluo1'] if x in df.columns]
          acq=df.groupby(fields,dropna=False).agg(rows=('time_sec','size'),unique_cells=('cell','nunique'),min_t=('time_sec','min'),max_t=('time_sec','max'),mode_frequency=('acq_freq_sec',lambda x:x.mode().iat[0] if not x.mode().empty else None),unique_freqs=('acq_freq_sec','nunique')).reset_index()
          acq.to_csv(P/'E500_original_light_control_condition_clock_groups.csv',index=False)
          rows=[]
          x=df[df.c_step.astype(str).eq('GM.2')].copy()
          if len(x):
            x=x[(x.time_start < x.m_start) & (x.b_rank==0)].copy()
            x['fate']=x.end_type.astype(str).map(lambda a:'Survive' if a=='div' else 'No Growth' if a in ('eod','lysis') else 'Unknown')
            x.loc[(x.fate=='Unknown')&(x.time_end>x.m_start+20*3600),'fate']='No Growth'
            events=x[['date','condition','strain','gl_id','cell','end_type','fate','time_start','time_end','m_start','m_end']].drop_duplicates().copy()
            events['illuminated']=~events.condition.astype(str).str.contains('NO_LIGHT',case=False)
            events['starvation_nominal_h']=events.condition.astype(str).map(lambda a:'60h' if '60h' in a else '25h')
            events.to_csv(P/'E500_original_illumination_mother_fate_candidates.csv',index=False)
            summaries=events.groupby(['date','condition','starvation_nominal_h','illuminated','fate'],dropna=False).size().reset_index(name='mother_cell_records')
            summaries.to_csv(P/'E500_original_illumination_date_condition_fate.csv',index=False)
            desc['mother_fate_candidate_rows']=len(events)
            desc['mother_fate_candidate_unique_keys']=int(events[['date','condition','cell']].drop_duplicates().shape[0])
            desc['mother_fate_fates']=events.fate.value_counts(dropna=False).to_dict()
            print('E500_SOURCE_FATE_GROUPS',summaries.to_string(index=False)[:11000],flush=True)
          desc['exposure_group_rows']=len(acq)
          (P/'E500_original_control_source_inventory.json').write_text(json.dumps(desc,indent=2,ensure_ascii=False,default=str))
          (P/'E500_original_source_receipt.json').write_text(json.dumps({
              'study':'Gervais et al 2026 DOI 10.1038/s44320-026-00226-5',
              'official_zenodo_record':18059846,'full_archive_downloaded':False,
              'original_selected_path':key,'original_member_sha256':hashlib.sha256(raw).hexdigest(),
              'original_member_size':len(raw),'original_member_crc32_hex':format(m['crc'],'08x'),
              'source_member_crc_pass':True,'selected_member_compressed_download':m['compressed'],
              'timestamp_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())},indent=2))
          print('E500_ORIGINAL_VERIFIED',hashlib.sha256(raw).hexdigest(),len(raw),flush=True)
          PY
      - name: Retain verified original bytes and exact source CSV/case identifiers
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 901-E500-verified-original-illumination-control-and-true-fate
          path: e500_author_original_control/
          retention-days: 21
          if-no-files-found: error
