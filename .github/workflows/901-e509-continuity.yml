name: "901 E509 MoMA division geometry and alternate continuity audit"
on:
  push:
    branches: [cloud-901-e509-cross-version-continuity-20261116]
    paths:
      - ".github/workflows/901-e509-continuity.yml"
      - "research_901/E509_20261116/e509_continuity_qa.py"
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        archive:
          - 20221220_E08_GFP.zip
          - 20221220_E08_GFP_pl.zip
          - 20221220_rplN_GFP_pl.zip
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research_901/E507_20261116
            research_901/E508_20261116
            research_901/E509_20261116
      - run: python -m pip install -q requests
      - name: Independently reacquire true original E507 source members and match E508 disputed events
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          python research_901/E508_20261116/e508_event_conflicts.py --archive "$ARCHIVE" --recompute-official-csv
      - name: Compare daughter division geometry to alternate-version mother continuity
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          python research_901/E509_20261116/e509_continuity_qa.py --archive "$ARCHIVE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 901-E509-source-continuity-${{ matrix.archive }}
          path: |
            e509_continuity_qa/
            e508_source_conflicts/
          retention-days: 30
          if-no-files-found: warn
