name: "901 E529 two original probability pixels"
on:
  push:
    branches:
      - cloud-901-e529-direct-source-two-pixels-20261117
    paths:
      - '.github/workflows/901-e529-two-pixels-official.yml'
      - 'research_901/E529_20261117/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-one-pixels:
    if: github.repository == 'dairongzhen3-creator/math'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research_901/E529_20261117
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded TIFF parsing dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5' 'tifffile==2026.9.11' 'requests==2.32.5'
      - name: Preflight script syntax and run strict public-source ZIP64 range verification
        run: |
          python -m py_compile research_901/E529_20261117/e529_official_two_prob_pixels.py
          python research_901/E529_20261117/e529_official_two_prob_pixels.py
      - name: Preserve results and any error receipts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 901-E529-two-original-pixels-public-source
          path: E529_outputs/
          retention-days: 14
          if-no-files-found: warn
