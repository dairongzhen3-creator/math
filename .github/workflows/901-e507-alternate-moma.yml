name: "901 E507 source alternate MoMA cost-function segmentation sensitivity"
on:
  push:
    branches: [cloud-901-e507-frozen-image-controls-20261116]
    paths:
      - ".github/workflows/901-e507-alternate-moma.yml"
      - "research_901/E507_20261116/e507_alternate_segmentation.py"
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        archive:
          - 20221220_E08_GFP.zip
          - 20221220_E08_GFP_pl.zip
          - 20221220_rplN_GFP_pl.zip
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research_901/E507_20261116
      - run: python -m pip install -q requests
      - name: Verify main and alternate source CSV SHA/ZIP CRC, compare divisions at same frame and bbox
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: python research_901/E507_20261116/e507_alternate_segmentation.py --archive "$ARCHIVE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 901-E507-alt-moma-${{ matrix.archive }}
          path: e507_alternate_QA/
          retention-days: 21
          if-no-files-found: warn
