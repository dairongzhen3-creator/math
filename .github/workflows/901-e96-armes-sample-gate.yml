name: 901 E96 bounded Armes metadata and supplementary truth gate
on:
  push:
    branches: ['cloud-public-sources-901-e96-20261026']
    paths: ['.github/workflows/901-e96-armes-sample-gate.yml']
permissions: {}
jobs:
  source-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    steps:
      - name: Acquire only official bounded public metadata and supplemental tables
        shell: bash
        run: |
          python3 - <<'PY'
          import io,os,re,json,hashlib,pathlib,urllib.request,urllib.parse,csv,zipfile,xml.etree.ElementTree as ET
          out=pathlib.Path('e96_public_source_small');out.mkdir()
          result={'project':901,'stage':'E96','run_id':os.environ.get('GITHUB_RUN_ID'),'scope':'Official Armes2025 public source metadata, noninteractive; no raw MS spectra or FASTQ','items':[]}
          ua='ScientificProvenanceNoncommercial/1.0 (read-only open metadata)'
          def get(label,url,limit,mode):
              obj={'name':label,'source_url':url,'status':'NOT_RECEIVED','size_cap_bytes':limit}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'*/*'})
                  with urllib.request.urlopen(req,timeout=27) as resp:
                      data=resp.read(limit+1)
                      obj['http_status']=resp.status
                      obj['content_type']=(resp.headers.get('Content-Type') or '')[:130]
                      obj['final_url']=resp.url[:360]
                  if len(data)>limit:raise ValueError('OVER_BYTES_CAP')
                  if len(data)<15:raise ValueError('EMPTY_OR_TOO_SHORT')
                  if mode=='xlsx':
                      if not data.startswith(b'PK\x03\x04'):raise ValueError('NOT_ZIP_XLSX_MAGIC')
                      z=zipfile.ZipFile(io.BytesIO(data))
                      if z.testzip():raise ValueError('OOXML_BAD_CRC')
                      if 'xl/workbook.xml' not in z.namelist():raise ValueError('NOT_WORKBOOK')
                  elif mode in ('tsv','csv'):
                      head=data[:400].lstrip().lower()
                      if head.startswith(b'<html') or b'<!doctype html' in head or head.startswith(b'<?xml'):raise ValueError('HTML_OR_XML_NOT_TABLE')
                      if b'\n' not in data:raise ValueError('NOT_TABLE_LINES')
                  elif mode=='html':
                      if b'<html' not in data[:2000].lower() and b'<!doctype html' not in data[:2000].lower():raise ValueError('NO_HTML')
                  obj.update(status='DOWNLOADED_VALID_TYPE',bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),md5=hashlib.md5(data).hexdigest())
                  suffix={'xlsx':'.xlsx','tsv':'.tsv','csv':'.csv','html':'.html'}[mode]
                  (out/(label+suffix)).write_bytes(data)
                  return obj,data
              except Exception as e:
                  obj.update(status='FAILED_OR_BLOCKED',error_type=type(e).__name__,error=str(e)[:230])
                  return obj,None
          ENA='https://www.ebi.ac.uk/ena/portal/api/filereport?'+urllib.parse.urlencode({'accession':'PRJNA1190957','result':'read_run','fields':'run_accession,sample_accession,experiment_accession,library_name,sample_title','format':'tsv'})
          a,ena=get('ENA_PRJNA1190957_run_sample_metadata',ENA,1300000,'tsv')
          if ena:
              ls=ena.decode('utf-8-sig','replace').splitlines()
              header=ls[0].split('\t')
              rows=[dict(zip(header,line.split('\t'))) for line in ls[1:] if line.strip()]
              a.update(columns=header,row_count=len(rows),first_two_rows=rows[:2],distinct_sample_accessions=len(set(r.get('sample_accession','') for r in rows)))
          result['items'].append(a)
          if ena is None:
              URL2='https://www.ebi.ac.uk/ena/portal/api/filereport?'+urllib.parse.urlencode({'accession':'PRJNA1190957','result':'read_run','format':'tsv'})
              a2,ena2=get('ENA_PRJNA1190957_default_run_metadata',URL2,1800000,'tsv')
              if ena2:
                  lines=ena2.decode('utf-8-sig','replace').splitlines()
                  a2.update(columns=lines[0].split('\t')[:35],row_count=max(0,len(lines)-1),first_row=lines[1][:700] if len(lines)>1 else None)
              result['items'].append(a2)
          ncbi='https://trace.ncbi.nlm.nih.gov/Traces/sra-db-be/runinfo?acc=PRJNA1190957'
          b,runs=get('NCBI_SRA_runinfo',ncbi,1700000,'csv')
          if runs:
              lines=runs.decode('utf-8-sig','replace').splitlines()
              cr=list(csv.DictReader(io.StringIO('\n'.join(lines))))
              b.update(columns=lines[0].split(',')[:50],row_count=len(cr),first_two_rows=[{k:v for k,v in row.items() if k in ('Run','BioSample','SampleName','LibraryName','Experiment','BioProject','Sample','Sample_Name','Library_Name')} for row in cr[:2]])
          result['items'].append(b)
          mass='https://massive.ucsd.edu/ProteoSAFe/dataset_files.jsp?task=884dc491ce664fec99035f73e8f06e69'
          c,page=get('MassIVE_MSV000096353_dataset_files',mass,1700000,'html')
          if page:
              s=page.decode('utf8','replace')
              names=sorted(set(re.findall(r'f[.]MSV000096353/[^<\s"\'&]{2,220}',s,re.I)))
              c.update(file_paths_found_count=len(names),file_paths_first_80=names[:80],mentions_partial_public='Partial Public' in s,contains_file_table='Dataset Files' in s)
              if not names:c['status']='HTML_ONLY_NO_FILE_ROWS_IN_RECEIVED_SOURCE'
          result['items'].append(c)
          sup='https://pmc.ncbi.nlm.nih.gov/articles/instance/12306166/bin/msphere.01050-24-s0002.xlsx'
          d,xlsx=get('PMC_ARME2025_supplemental_tables_S1_S7',sup,5500000,'xlsx')
          if xlsx:
              z=zipfile.ZipFile(io.BytesIO(xlsx))
              names=z.namelist()
              ns={'s':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
              wb=ET.fromstring(z.read('xl/workbook.xml'))
              sheetnames=[node.get('name') for node in wb.findall('.//s:sheet',ns)]
              shared=[]
              if 'xl/sharedStrings.xml' in names:
                  info=z.getinfo('xl/sharedStrings.xml')
                  if info.file_size<=16000000:
                      root=ET.fromstring(z.read('xl/sharedStrings.xml'))
                      shared=[''.join(y.text or '' for y in x.iter() if y.tag.endswith('}t')) for x in root]
              sheets=[]
              for sn in sorted([p for p in names if re.fullmatch(r'xl/worksheets/sheet\d+\.xml',p)],key=lambda p:int(re.search(r'sheet(\d+)',p).group(1))):
                  info=z.getinfo(sn)
                  x={'file':sn,'uncompressed_bytes':info.file_size,'first_rows':[]}
                  try:
                      with z.open(sn) as fh:
                          for ev,el in ET.iterparse(fh,events=('end',)):
                              if not el.tag.endswith('}row'):continue
                              rr=[]
                              for cell in list(el):
                                  if not cell.tag.endswith('}c'):continue
                                  v=next((t.text for t in cell.iter() if t.tag.endswith('}v')),None)
                                  if cell.get('t')=='s' and v is not None:
                                      try:v=shared[int(v)] if shared else 'shared_string_'+v
                                      except (IndexError,ValueError):v='UNRESOLVED_SHARED_'+v
                                  if v is None and cell.get('t')=='inlineStr':
                                      v=''.join(t.text or '' for t in cell.iter() if t.tag.endswith('}t'))
                                  if v is not None:rr.append({'cell':cell.get('r'),'v':str(v)[:90]})
                              x['first_rows'].append({'row':el.get('r'),'cells':rr[:25]})
                              if len(x['first_rows'])>=3:break
                  except Exception as e:x['parse_error']=str(e)[:150]
                  sheets.append(x)
              d.update(sheet_names=sheetnames,sheets_first_three_rows=sheets,shared_strings_loaded=len(shared))
          result['items'].append(d)
          result['tested_machine_join']=False
          result['new_eligible_joint_sample_count']=0
          result['bit_per_joule']='NOT_IDENTIFIED'
          result['comment']='No pairing is certified by matching passage and treatment alone; SRA-BioSample and LCMS raw file physical IDs require explicit sample map.'
          (out/'E96_open_source_gate_manifest.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('E96_QC_JSON='+json.dumps(result,ensure_ascii=False)[:26000])
          PY
      - name: Preserve one day bounded evidence (raw metadata, small source tables if available)
        uses: actions/upload-artifact@v4
        with:
          name: 901-e96-armes-source-and-truth-gate
          path: e96_public_source_small/
          retention-days: 1
          if-no-files-found: error
