name: "901 E116 dependency-free original XLSX source gate"
on:
  push:
    paths:
      - '.github/workflows/901-e116-ooxml-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'dairongzhen3-creator/math'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check public original workbook native OOXML directly with Python standard library only
        shell: bash
        run: |
          python3 - <<'PY'
          from io import BytesIO
          import hashlib,urllib.request,zipfile,xml.etree.ElementTree as ET,json,re,posixpath
          from pathlib import Path
          url='https://zenodo.org/records/19386720/files/Supplementary%20data%20and%20code.zip?download=1'
          req=urllib.request.Request(url,headers={'User-Agent':'901-E116-original-source-readonly'})
          with urllib.request.urlopen(req,timeout=45) as f: outer=f.read(14000001)
          assert len(outer)<=14000000
          assert hashlib.md5(outer).hexdigest()=='9ceba7a9ad2c868eaa9ef422e50f091e'
          report={'stage':'E116','source_zenodo':'19386720','archive_bytes':len(outer),'external_source_executed':False,'parser':'stdlib_zipfile_ElementTree'}
          with zipfile.ZipFile(BytesIO(outer)) as z:
              paths=[n for n in z.namelist() if n.endswith('/plant_data.xlsx')]
              assert len(paths)==1
              b=z.read(paths[0]);report['xlsx_sha256']=hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile(BytesIO(b)) as z:
              report['xlsx_members']=[{'name':x.filename,'bytes':x.file_size} for x in z.infolist() if re.search('workbook|sheet\d|sharedStrings',x.filename)]
              M='{http://schemas.openxmlformats.org/spreadsheetml/2006/main}'
              REL='{http://schemas.openxmlformats.org/officeDocument/2006/relationships}'
              root=ET.fromstring(z.read('xl/workbook.xml'))
              ss=[]
              if 'xl/sharedStrings.xml' in z.namelist():
                  with z.open('xl/sharedStrings.xml') as f:
                      for ev,el in ET.iterparse(f,events=('end',)):
                          if el.tag==M+'si':
                              ss.append(''.join((t.text or '') for t in el.iter() if t.tag==M+'t'))
                              el.clear()
              report['shared_string_count']=len(ss)
              relroot=ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
              rid={e.attrib.get('Id'):e.attrib.get('Target') for e in relroot}
              sheets=[]
              for sheet in root.iter():
                  if sheet.tag!=M+'sheet': continue
                  id=sheet.attrib.get(REL+'id');target=rid.get(id)
                  if not target: continue
                  path=(target.lstrip('/') if target.startswith('/') else posixpath.normpath('xl/'+target))
                  if path not in z.namelist(): continue
                  sheetrec={'sheet':sheet.attrib.get('name'),'path':path,'compressed_zip_bytes':z.getinfo(path).compress_size,'uncompressed_bytes':z.getinfo(path).file_size}
                  with z.open(path) as f:
                      n=0
                      for ev,row in ET.iterparse(f,events=('end',)):
                          if row.tag!=M+'row': continue
                          n+=1
                          cells=[]
                          for c in row.findall(M+'c'):
                              val=c.find(M+'v'); inline=c.find(M+'is');form=c.find(M+'f')
                              value=(val.text if val is not None else None)
                              if c.attrib.get('t')=='s' and value is not None:
                                  j=int(value);value=ss[j] if j<len(ss) else '<MISSING_SHARED_STRING>'
                              elif inline is not None:
                                  value=''.join(t.text or '' for t in inline.iter() if t.tag==M+'t')
                              elif form is not None and value is None: value='<FORMULA>'
                              cells.append({'cell':c.attrib.get('r'),'value':str(value)[:100] if value is not None else None})
                          if n<=10: sheetrec.setdefault('first_ten_rows',[]).append({'row':row.attrib.get('r'),'nonblank_cells':cells[:40]})
                          row.clear()
                          if n==10: break
                  sheets.append(sheetrec)
              report['sheets']=sheets
          Path('901_e116_ooxml_gate.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          print('E116_OOXML',json.dumps(report,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 901-E116-Ooxml-original-source-gate
          path: 901_e116_ooxml_gate.json
          if-no-files-found: warn
          retention-days: 7
