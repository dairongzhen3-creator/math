name: 901 E105 public Lactococcus turnover source & cell-free protein/ATP table provenance
on:
  push:
    branches: ['cloud-public-sources-901-e105-20261027']
    paths: ['.github/workflows/901-e105-two-study-source-gate.yml']
permissions: {}
jobs:
  e105:
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    steps:
      - name: Official PXD000494 metadata + bounded 2009 article JATS, no raw proteomics downloads
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request, urllib.parse, urllib.error, json, hashlib, xml.etree.ElementTree as ET,re,html,os
          d=pathlib.Path('e105_source_metadata');d.mkdir()
          allow={'www.ebi.ac.uk','proteomecentral.proteomexchange.org','pmc-oa-opendata.s3.amazonaws.com','www.ncbi.nlm.nih.gov','journals.asm.org'}
          source={'project':901,'stage':'E105','run':os.getenv('GITHUB_RUN_ID'),'datasets':['PXD000494','PMC2632092'],'records':[],'finding':'CHECKED_PUBLIC_MACHINE_SURFACES_ONLY_NO_BIG_RAW'}
          def f(name,url,cap,typ):
              rec={'label':name,'url':url,'status':'NOT_OBTAINED','max_bytes':cap}
              try:
                  if urllib.parse.urlsplit(url).hostname not in allow:raise ValueError('BAD_SOURCE_HOST')
                  req=urllib.request.Request(url,headers={'User-Agent':'NoncommercialScientificProvenance/1.0','Accept':'application/json,application/xml,text/html'})
                  with urllib.request.urlopen(req,timeout=34) as r:
                      if urllib.parse.urlsplit(r.url).hostname not in allow:raise ValueError('REDIRECT_SOURCE_HOST')
                      length=r.headers.get('Content-Length')
                      if length and int(length)>cap:raise ValueError('CONTENT_LENGTH_OVER_CAP')
                      b=r.read(cap+1)
                      rec.update(http=r.status,content_type=r.headers.get('Content-Type','')[:90],resolved_url=r.url[:250])
                  if len(b)<8 or len(b)>cap:raise ValueError('EMPTY_OR_EXCEEDS_CAP')
                  prefix=b.lstrip()[:100].lower()
                  if typ in ('json','xml') and prefix.startswith((b'<html',b'<!doctype html')):raise ValueError('HTML_ERROR_NOT_SOURCE')
                  if typ=='json':obj=json.loads(b)
                  elif typ=='xml':obj=ET.fromstring(b)
                  else:obj=b.decode('utf8','replace')
                  rec.update(status='PUBLIC_SOURCE_BYTES_PASS',bytes=len(b),md5=hashlib.md5(b).hexdigest(),sha256=hashlib.sha256(b).hexdigest())
                  (d/(name+'.'+typ)).write_bytes(b)
                  return rec,obj
              except Exception as e:
                  rec.update(status='NOT_RETRIEVED_OR_REJECTED',error_type=type(e).__name__,error=str(e)[:190]);return rec,None
          # official EBI PRIDE project metadata and file listing
          endpoints=[
              ('PRIDE_PXD000494_project','https://www.ebi.ac.uk/pride/ws/archive/v3/projects/PXD000494',350000),
              ('PRIDE_PXD000494_file_manifest','https://www.ebi.ac.uk/pride/ws/archive/v3/projects/PXD000494/files?pageSize=100&page=0',1100000),
          ]
          for name,url,cap in endpoints:
              rec,obj=f(name,url,cap,'json')
              if obj is not None:
                  rec['json_type']=type(obj).__name__
                  if 'project' in name:
                      rec['project_name']=str(obj.get('title',''))[:220] if isinstance(obj,dict) else None
                      rec['project_accession']=obj.get('accession') if isinstance(obj,dict) else None
                      rec['reference_dois']=[str(x.get('doi','')) for x in obj.get('references',[]) if isinstance(x,dict)] if isinstance(obj,dict) else []
                      rec['project_relevant_fields']={k:obj.get(k) for k in ('numAssays','submissionDate','publicationDate','projectDescription') if isinstance(obj,dict) and k in obj}
                  elif isinstance(obj,(list,dict)):
                      rows=obj if isinstance(obj,list) else (obj.get('_embedded',{}).get('files') or obj.get('files') or obj.get('content') or [])
                      rec['manifest_row_count']=len(rows)
                      desc=[]
                      for row in rows:
                          if not isinstance(row,dict):continue
                          desc.append({'fileName':row.get('fileName') or row.get('name'),'fileSizeBytes':row.get('fileSizeBytes') or row.get('fileSize'),'fileCategory':row.get('fileCategory'),'public_locations':row.get('publicFileLocations')})
                      rec['files_by_type']={}
                      for x in desc:
                          c=x.get('fileCategory',{}); namec=c.get('value') if isinstance(c,dict) else str(c)
                          rec['files_by_type'][namec]=rec['files_by_type'].get(namec,0)+1
                      rec['manifest_first_30']=desc[:30]
                      (d/'E105_PXD000494_machine_file_manifest.json').write_text(json.dumps(desc,ensure_ascii=False,indent=2)+'\n')
              source['records'].append(rec)
          # complementary official ProteomeXchange structured project description, no spectral data
          rec,obj=f('ProteomeXchange_PXD000494_dataset','https://proteomecentral.proteomexchange.org/cgi/GetDataset?ID=PXD000494&outputMode=XML',750000,'xml')
          if obj is not None:
              rec['root']=obj.tag
              rec['accession_references']=list(set([e.get('accession','') for e in obj.iter() if 'accession' in e.attrib]))[:20]
          source['records'].append(rec)
          # NLM 2026 open-media object is per copyright/permissions; try bounded versions, do not assume availability.
          archive='https://pmc-oa-opendata.s3.amazonaws.com/'
          found=False
          for version in (1,2,3,4,5):
              rec,obj=f('NLM_PMC2632092_metadata_v'+str(version),archive+'metadata/PMC2632092.'+str(version)+'.json',220000,'json')
              if isinstance(obj,dict):
                  rec['pmcid_returned']=obj.get('pmcid')
                  rec['article_doi_returned']=obj.get('doi')
                  if obj.get('pmcid')=='PMC2632092' and '10.1128' in str(obj.get('doi','')).lower():
                      rec['media_count']=len(obj.get('media_urls') or [])
                      rec['media_names']=[str(v if isinstance(v,str) else v.get('url','')).rsplit('/',1)[-1][:170] for v in obj.get('media_urls',[])][:40]
                      xml=obj.get('xml_url')
                      if isinstance(xml,str):
                          if xml.startswith('s3://pmc-oa-opendata/'):xml=archive+xml.split('s3://pmc-oa-opendata/',1)[1]
                          if xml.startswith(archive):
                              x,root=f('NLM_PMC2632092_original_JATS',xml,450000,'xml')
                              if root is not None:
                                  tablewrap=[t for t in root.iter() if t.tag.rsplit('}',1)[-1]=='table-wrap']
                                  x['table_count']=len(tablewrap)
                                  x['table_headers']=[]
                                  for t in tablewrap:
                                      caption=' '.join(''.join(k.itertext()).split())[:250]
                                      x['table_headers'].append(caption[:180])
                                      if 'radioactivity' in caption.lower() and 'atp' in caption.lower():
                                          x['target_table_1_rows']=[]
                                          for tr in t.iter():
                                              if tr.tag.rsplit('}',1)[-1]!='tr':continue
                                              vals=[' '.join(''.join(td.itertext()).split()) for td in tr if td.tag.rsplit('}',1)[-1] in ('td','th')]
                                              x['target_table_1_rows'].append(vals)
                                  source['records'].append(x)
                              found=True
              source['records'].append(rec)
              if found:break
          source['published_raw_biosample_linkage']='NOT_CERTIFIED_FROM_PROJECT_METADATA'
          source['direct_ATP_hydrolysis_W']='NOT_RETRIEVED'
          (d/'E105_official_repository_source_gate_receipt.json').write_text(json.dumps(source,ensure_ascii=False,indent=2)+'\n')
          print('E105_SOURCE_GATE='+json.dumps(source,ensure_ascii=False)[:26500])
          PY
      - name: Archive metadata and machine listing only, no raw spectra
        uses: actions/upload-artifact@v4
        with:
          name: 901-e105-PRIDE-PXD000494-and-Jewett-article-source-gate
          path: e105_source_metadata/
          retention-days: 1
          if-no-files-found: error
