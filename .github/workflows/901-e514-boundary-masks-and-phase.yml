name: "901 E514 original Phase-contrast boundary-mask recurrence and negative controls"
on:
  push:
    branches: [cloud-901-e514-repeated-boundary-candidates-20261117]
    paths:
      - ".github/workflows/901-e514-boundary-masks-and-phase.yml"
      - "research_901/E514_20261117/e514_contour_recurrence_and_phase_controls.py"
permissions:
  contents: read
  actions: read
jobs:
  source-image-sensitivity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research_901/E514_20261117
      - name: Install deterministic image checks
        run: python -m pip install -q numpy scipy scikit-image pillow
      - name: Retrieve immutable official-source-certified prior research artifacts via GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          python - <<'PY'
          import os,urllib.request,time,pathlib,hashlib
          mapping=[
            (14204949075, "901_E510_Pos5_GL35_original_pixels.zip"),
            (14205890031, "901_E510_Pos12_GL22_original_pixels.zip"),
            (14206912698, "901_E512_Pos5_GL35_full_original_components.zip"),
            (14206284348, "901_E512_Pos12_GL22_full_original_components.zip"),
            (14206584689, "901_E512b_Pos5_GL35_exact_div_to_map.zip"),
            (14206584686, "901_E512b_Pos12_GL22_exact_div_to_map.zip"),
          ]
          for aid,name in mapping:
              url=f"https://api.github.com/repos/dairongzhen3-creator/math/actions/artifacts/{aid}/zip"
              last=None
              for attempt in range(5):
                  try:
                      req=urllib.request.Request(url,headers={
                        "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                        "Accept":"application/vnd.github+json",
                        "X-GitHub-Api-Version":"2022-11-28",
                        "User-Agent":"901-E514-immutable-source-replay"
                      })
                      with urllib.request.urlopen(req,timeout=100) as rsp:
                          assert rsp.status==200 and rsp.headers.get('Content-Type','').startswith(('application/zip','application/octet-stream'))
                          bb=rsp.read()
                      if bb[:4]!=bytes.fromhex("504b0304"):raise RuntimeError("not ZIP")
                      pathlib.Path("input",name).write_bytes(bb)
                      print("E514_INPUT_RECEIPT",name,len(bb),hashlib.sha256(bb).hexdigest())
                      break
                  except Exception as e:
                      last=e;time.sleep(2*(attempt+1))
              else:raise last
          PY
      - name: Check official-source archived file SHA and ZIP CRC; reproduce source masks and independent phase-only diagnostics
        run: python research_901/E514_20261117/e514_contour_recurrence_and_phase_controls.py --input input --output e514_result
      - name: Persist only new E514 source-mask and optical diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 901-E514-source-mask-repeat-and-phase-controls
          path: e514_result/
          retention-days: 30
          if-no-files-found: warn
