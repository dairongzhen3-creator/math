name: E27 publisher supplement & code metadata fetch
on:
  push:
    branches: ['cloud-public-sources-901-e27-20261023']
    paths: ['.github/workflows/901-e27-source-only.yml']
permissions: {}
jobs:
  transport:
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    steps:
      - name: Fetch only published supplementary PDF and software metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,urllib.request,json,hashlib,os
          folder=pathlib.Path('public_901_e27_sources');folder.mkdir()
          paths=[
          ('official_media','https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs42003-020-01553-5/MediaObjects/42003_2020_1553_MOESM2_ESM.pdf'),
          ('official_static','https://static-content.springer.com/esm/art%3A10.1038%2Fs42003-020-01553-5/MediaObjects/42003_2020_1553_MOESM2_ESM.pdf'),
          ('pmc','https://pmc.ncbi.nlm.nih.gov/articles/PMC7794433/bin/42003_2020_1553_MOESM2_ESM.pdf')]
          results=[]
          for name,url in paths:
            entry={'route':name,'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'PublicAcademicLiteratureCheck/1.0','Accept':'application/pdf,application/octet-stream,*/*'})
              with urllib.request.urlopen(req,timeout=14) as response:
                data=response.read(7_000_001)
                entry['http_status']=response.status
              if len(data)>7_000_000 or not data.startswith(b'%PDF-'):
                raise ValueError('Not bounded valid PDF bytes')
              filename='Dogsa2021_publisher_SupplementaryInformation.pdf'
              (folder/filename).write_bytes(data)
              entry.update({'status':'PDF_PASS','bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              results.append(entry)
              break
            except Exception as e:entry.update({'status':'FAILED','error':type(e).__name__+': '+str(e)[:160]})
            results.append(entry)
          code={}
          for record in ('4206230','4205585'):
            url=f'https://zenodo.org/api/records/{record}'
            entry={'record':record,'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'PublicAcademicLiteratureCheck/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=14) as response:
                data=response.read(500001)
                entry['http_status']=response.status
              if len(data)>500000:raise ValueError('metadata >500kB')
              json.loads(data)
              path=folder/f'zenodo_{record}_public_metadata.json';path.write_bytes(data)
              entry.update({'status':'JSON_PASS','bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
            except Exception as e:entry.update({'status':'FAILED','error':type(e).__name__+': '+str(e)[:160]})
            code[record]=entry
          manifest={'paper_doi':'10.1038/s42003-020-01553-5','run_id':os.environ.get('GITHUB_RUN_ID'),'source_only_no_analysis':True,'pdf_results':results,'code_records':code}
          (folder/'E27_SOURCE_FETCH_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(manifest,ensure_ascii=False))
          PY
      - name: Transport original public bytes one-day only
        uses: actions/upload-artifact@v4
        with:
          name: e27-public-origin-colocalization-supplement
          path: public_901_e27_sources/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
