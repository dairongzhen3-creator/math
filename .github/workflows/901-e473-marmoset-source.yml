name: "901 E473 marmoset public paired-caller source audit"
on:
  push:
    branches: [cloud-901-e473-marmoset-20261112]
    paths: ['.github/workflows/901-e473-marmoset-source.yml']
permissions:
  contents: read
jobs:
  public-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Download official Zenodo source and verify checksums
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, pathlib, hashlib, json, zipfile, io
          out=pathlib.Path('e473_public_source');out.mkdir(exist_ok=True)
          sources=[('README.md','85c39554a7b74a698285eb905ea3528c',100000),
                   ('vocal_turn_taking_data.zip','17efac7991850deb21d04206e4ed9be4',5000000)]
          receipt={'data_doi':'10.5061/dryad.9ghx3ffpx','zenodo_record':11505713,'files':{}}
          for name,expected,limit in sources:
            url=f'https://zenodo.org/records/11505713/files/{name}?download=1'
            d={'url':url,'expected_md5':expected,'verified':False}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'901-E473-academic-public-source-verifier/1.0'})
              with urllib.request.urlopen(req,timeout=35) as r:
                raw=r.read(limit+1);d['http_status']=r.status;d['content_type']=r.headers.get('Content-Type')
              d['bytes']=len(raw)
              d['md5']=hashlib.md5(raw).hexdigest()
              d['sha256']=hashlib.sha256(raw).hexdigest()
              if len(raw)<=limit and d['md5']==expected:
                (out/name).write_bytes(raw);d['verified']=True
                if name.endswith('.zip'):
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:
                    members=[{'name':i.filename,'bytes':i.file_size,'compressed_bytes':i.compress_size,'crc':i.CRC} for i in z.infolist()]
                    d['zip_member_count']=len(members)
                    d['zip_uncompressed_total']=sum(m['bytes'] for m in members)
                    d['zip_crc_pass']=z.testzip() is None
                    (out/'zip_manifest.json').write_text(json.dumps(members,indent=2),encoding='utf-8')
              else:d['error']='checksum/size mismatch; file rejected'
            except Exception as e:
              d['error']=f'{type(e).__name__}: {str(e)[:250]}'
            print('E473_FILE',name,json.dumps(d,ensure_ascii=False))
            receipt['files'][name]=d
          receipt['both_verified']=all(x['verified'] for x in receipt['files'].values())
          (out/'source_receipt.json').write_text(json.dumps(receipt,indent=2,ensure_ascii=False),encoding='utf-8')
          print('E473_VERDICT', 'PASS' if receipt['both_verified'] else 'INCOMPLETE')
          PY
      - name: Keep source and verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 901-e473-marmoset-verified-source
          path: e473_public_source/
          if-no-files-found: error
          retention-days: 21
